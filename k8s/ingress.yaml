apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vehiclesphere-ingress
  namespace: vehiclesphere
  labels:
    app.kubernetes.io/name: vehiclesphere-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: vehiclesphere.local
      http:
        paths:
          # Backend API routes
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Spring Boot Actuator
          - path: /actuator/
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Swagger Documentation
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Frontend SPA Web Client
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
