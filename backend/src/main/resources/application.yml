server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: vehiclesphere-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehiclesphere}
    username: ${DB_USERNAME:vehiclesphere}
    password: ${DB_PASSWORD:vehiclesphere}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false

app:
  jwt:
    secret: ${JWT_SECRET:changeThisToAVeryLongAndSecureRandomSecretKeyForProductionUse2024VehicleSphereVehicleSphereSecureToken}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_VehicleSphereMock}
    key-secret: ${RAZORPAY_KEY_SECRET:VehicleSphereRazorpayTestSecret2024}
  mail:
    from: ${MAIL_FROM:notifications@vehiclesphere.com}
    enabled: ${MAIL_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
