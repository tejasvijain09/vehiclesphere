apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vehiclesphere.fullname" . }}-secrets
  labels:
    {{- include "vehiclesphere.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  RAZORPAY_KEY_ID: {{ .Values.secrets.razorpayKeyId | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.razorpayKeySecret | quote }}
