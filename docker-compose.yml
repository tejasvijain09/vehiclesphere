# =============================================================================
# VehicleSphere — Multi-Container Docker Compose Stack
# Services: PostgreSQL 17 + Spring Boot Backend + React Frontend + Nginx Proxy
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. Database: PostgreSQL 17 Engine
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: vehiclesphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vehiclesphere}
      POSTGRES_USER: ${DB_USERNAME:-vehiclesphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vehiclesphere}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vehiclesphere} -d ${DB_NAME:-vehiclesphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vehiclesphere-network

  # ---------------------------------------------------------------------------
  # 2. Application Backend: Spring Boot 3 + Java 21 LTS
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehiclesphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vehiclesphere}
      DB_USERNAME: ${DB_USERNAME:-vehiclesphere}
      DB_PASSWORD: ${DB_PASSWORD:-vehiclesphere}
      JWT_SECRET: ${JWT_SECRET:-changeThisToAVeryLongAndSecureRandomSecretKeyForProductionUse2024VehicleSphereVehicleSphereSecureToken}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_VehicleSphereMock}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-MockSecretKeyVehicleSphereTest123}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-notifications@vehiclesphere.com}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - vehiclesphere-network

  # ---------------------------------------------------------------------------
  # 3. Application Frontend: React 18 SPA + Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: vehiclesphere-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vehiclesphere-network

  # ---------------------------------------------------------------------------
  # 4. Edge Reverse Proxy: Nginx Load Balancer & Security Gateway
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: vehiclesphere-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vehiclesphere-network

# -----------------------------------------------------------------------------
# Networks & Persistent Storage Volumes
# -----------------------------------------------------------------------------
networks:
  vehiclesphere-network:
    driver: bridge
    name: vehiclesphere-network

volumes:
  pgdata:
    name: vehiclesphere-pgdata
