# =============================================================================
# VehicleSphere — Prometheus Alerting Rules
# =============================================================================

groups:
  - name: vehiclesphere_service_alerts
    rules:
      # 1. Backend Service Down
      - alert: VehicleSphereBackendDown
        expr: up{job="vehiclesphere-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "VehicleSphere Spring Boot backend is unreachable"
          description: "Instance {{ $labels.instance }} has been down for more than 1 minute. API and reservation requests are failing."

      # 2. High HTTP 5xx Error Rate (> 5% of total requests)
      - alert: VehicleSphereHigh5xxErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) * 100 > 5
        for: 3m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "High HTTP 5xx error rate detected on backend (> 5%)"
          description: "Over 5% of HTTP requests returned 5xx server errors in the last 5 minutes on {{ $labels.instance }}."

      # 3. High HTTP Response Latency (p95 > 1.5 seconds)
      - alert: VehicleSphereHighResponseLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.5
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "High p95 HTTP latency on VehicleSphere API (> 1.5s)"
          description: "The 95th percentile HTTP request duration has exceeded 1.5 seconds over the last 5 minutes."

      # 4. High JVM Heap Memory Utilization (> 85%)
      - alert: VehicleSphereHighJvmMemoryUsage
        expr: |
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) * 100 > 85
        for: 3m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "VehicleSphere JVM heap memory usage above 85%"
          description: "JVM heap memory usage on instance {{ $labels.instance }} is currently at {{ $value | printf \"%.2f\" }}%."

      # 5. Database Connection Pool Starvation (HikariCP)
      - alert: VehicleSphereHikariPoolExhaustion
        expr: |
          hikaricp_connections_pending > 5
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "VehicleSphere HikariCP connection pool exhausted"
          description: "More than 5 threads are pending connection acquisition in HikariCP pool on {{ $labels.instance }}."

  - name: vehiclesphere_host_alerts
    rules:
      # 6. Host High CPU Load (> 90%)
      - alert: HostHighCpuLoad
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Host CPU utilization above 90%"
          description: "Host CPU utilization has been consistently over 90% for the past 5 minutes."

      # 7. Host Disk Space Low (< 15% available)
      - alert: HostLowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
          service: host
        annotations:
          summary: "Host root disk space critically low (< 15%)"
          description: "Host root filesystem has less than 15% free space remaining."
