# =============================================================================
# VehicleSphere — Observability & Monitoring Stack
# Prometheus + Grafana + Alertmanager + Loki + Promtail + Node Exporter
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vehiclesphere-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - vehiclesphere-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vehiclesphere-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - vehiclesphere-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: vehiclesphere-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - vehiclesphere-net

  loki:
    image: grafana/loki:3.1.1
    container_name: vehiclesphere-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    networks:
      - vehiclesphere-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: vehiclesphere-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - vehiclesphere-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vehiclesphere-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - vehiclesphere-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: vehiclesphere-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Collector internal metrics
      - "8889:8889" # Prometheus exporter metrics
    networks:
      - vehiclesphere-net

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:

networks:
  vehiclesphere-net:
    external: true
