# =============================================================================
# VehicleSphere — Nagios Host and Service Monitoring Definitions
# =============================================================================

# --- Host Definition: VehicleSphere Application Cluster ---
define host {
    use                     linux-server
    host_name               vehiclesphere-app
    alias                   VehicleSphere Application Cluster Host
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# --- Service: Edge Reverse Proxy (HTTP Port 80) ---
define service {
    use                     generic-service
    host_name               vehiclesphere-app
    service_description     Edge-ReverseProxy-HTTP
    check_command           check_vehiclesphere_http!80!/
    check_interval          1
    retry_interval          1
    notification_interval   15
}

# --- Service: Spring Boot Backend Actuator Health (Port 8080) ---
define service {
    use                     generic-service
    host_name               vehiclesphere-app
    service_description     SpringBoot-Actuator-Health
    check_command           check_spring_actuator_health!8080
    check_interval          1
    retry_interval          1
    notification_interval   15
}

# --- Service: PostgreSQL Database Connectivity (Port 5432) ---
define service {
    use                     generic-service
    host_name               vehiclesphere-app
    service_description     PostgreSQL-Database-Port
    check_command           check_tcp_port!5432
    check_interval          2
    retry_interval          1
    notification_interval   15
}

# --- Service: Prometheus Metrics Scraper Target (Port 9090) ---
define service {
    use                     generic-service
    host_name               vehiclesphere-app
    service_description     Prometheus-Monitoring-Service
    check_command           check_tcp_port!9090
    check_interval          5
    retry_interval          2
}

# --- Service: Grafana Dashboard Portal (Port 3000) ---
define service {
    use                     generic-service
    host_name               vehiclesphere-app
    service_description     Grafana-Observability-UI
    check_command           check_vehiclesphere_http!3000!/login
    check_interval          5
    retry_interval          2
}
