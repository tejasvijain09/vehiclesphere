# =============================================================================
# VehicleSphere — Nagios Command Definitions
# =============================================================================

# Check HTTP service response code
define command {
    command_name    check_vehiclesphere_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e "200,301,302"
}

# Check Spring Boot Actuator Health (/actuator/health)
define command {
    command_name    check_spring_actuator_health
    command_line    $USER1$/check_vehiclesphere_health.sh -H $HOSTADDRESS$ -p $ARG1$ -e /actuator/health
}

# Check TCP Port (e.g. PostgreSQL 5432)
define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 2 -c 5
}
