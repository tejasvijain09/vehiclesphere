---
# =============================================================================
# VehicleSphere — Master Site Playbook
# Provisions base host, installs container runtime, and deploys full stack
# =============================================================================

- name: Configure and harden application compute hosts
  hosts: app_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Update apt repository cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system utility packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - ufw
          - htop
          - jq
        state: present

  roles:
    - role: docker
    - role: app
