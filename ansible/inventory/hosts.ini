# =============================================================================
# VehicleSphere — Ansible Inventory Configuration
# =============================================================================

[app_servers]
app1 ansible_host=app1.vehiclesphere.internal ansible_user=ubuntu

[db_servers]
db1 ansible_host=db1.vehiclesphere.internal ansible_user=ubuntu

[monitoring_servers]
mon1 ansible_host=mon1.vehiclesphere.internal ansible_user=ubuntu

[all:vars]
ansible_python_interpreter=/usr/bin/python3
project_root=/opt/vehiclesphere
app_environment=prod
docker_compose_version=v2.29.2
